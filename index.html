<style>
/* Layout: workshop control panel — sticky status bar, bottom tab bar on phones, left rail on desktop; racing green + signal yellow */
:root{
  --bg:#e7eae3; --surface:#f6f7f2; --sunk:#dde1d8; --ink:#18201b; --muted:#5a6560; --line:#c6cdc2;
  --accent:#f2b705; --on-accent:#1a1a12; --green:#1d5a3b; --good:#2f8a55; --bad:#c2412d; --warn:#b77a06;
  --glass:#2b3a44; --tyre:#1c1f22; --arch:#141816; --rim:#9aa3a6; --shadow:rgba(20,30,25,.16);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101412; --surface:#181e1a; --sunk:#0c0f0d; --ink:#e6eae2; --muted:#94a097; --line:#2b342e;
  --accent:#f5c22b; --on-accent:#16140a; --green:#5fbf88; --good:#5fbf88; --bad:#ee6a52; --warn:#e2a93a;
  --glass:#3b5463; --tyre:#050606; --arch:#000; --rim:#7d878a; --shadow:rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101412; --surface:#181e1a; --sunk:#0c0f0d; --ink:#e6eae2; --muted:#94a097; --line:#2b342e;
  --accent:#f5c22b; --on-accent:#16140a; --green:#5fbf88; --good:#5fbf88; --bad:#ee6a52; --warn:#e2a93a;
  --glass:#3b5463; --tyre:#050606; --arch:#000; --rim:#7d878a; --shadow:rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;line-height:1;margin:0;text-wrap:balance}
h2{font-size:1.9rem;font-weight:900}
h3{font-size:1.25rem;font-weight:800}
small,.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:2px solid var(--ink);
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
.brand b{font-family:var(--display);font-weight:900;font-size:1.25rem;text-transform:uppercase;display:block;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:34px;height:34px;flex:none}
.hstats{display:flex;gap:16px;order:3;flex:1 1 100%}
.hstats div{display:flex;flex-direction:column;min-width:0}
.hstats b{font-size:1.05rem;font-weight:700}
.speed{display:flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;flex:none}
.speed button{background:transparent;border:0;padding:8px 11px;min-width:42px;font-weight:700;font-size:.9rem}
.speed button+button{border-left:1.5px solid var(--ink)}
.speed button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.iconbtn{background:transparent;border:1.5px solid var(--line);border-radius:8px;width:40px;height:38px;display:grid;place-items:center;flex:none}
@media (min-width:760px){.hstats{order:0;flex:0 1 auto}}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--ink);display:grid;grid-template-columns:repeat(6,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav button{background:transparent;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);position:relative}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:-2px;left:22%;right:22%;height:4px;background:var(--accent)}
.view{padding-block:18px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
@media (min-width:900px){
  .nav{top:0;bottom:0;right:auto;width:96px;grid-template-columns:1fr;grid-auto-rows:min-content;border-top:0;border-right:2px solid var(--ink);padding-top:calc(130px + env(safe-area-inset-top,0px))}
  .nav button{padding:14px 4px}
  .nav button[aria-current="page"]::before{top:18%;bottom:18%;left:0;right:auto;width:4px;height:auto}
  .top,.view{margin-left:96px}
  .view{padding-bottom:40px}
}

/* blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sect{display:flex;flex-direction:column;gap:10px}
.sect-h{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.05}
.kpi .sub{font-size:.8rem;color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.btn{border:1.5px solid var(--ink);background:var(--surface);border-radius:8px;padding:10px 14px;font-weight:700;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--on-accent)}
.btn.ghost{border-color:var(--line)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-weight:600;font-size:.9rem;min-height:40px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip:disabled{opacity:.5;cursor:not-allowed}
.chip .lk{font-size:.7rem;font-weight:700;opacity:.8}
.swatch{width:40px;height:40px;border-radius:50%;border:2px solid var(--line)}
.swatch[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.meter{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .3s}
.meter.y i{background:var(--accent)}
.stat{display:grid;grid-template-columns:96px 1fr 38px;gap:10px;align-items:center;font-size:.88rem}
.stat span:last-child{text-align:right;font-weight:700}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.dl div{display:flex;flex-direction:column}
.dl b{font-size:1.15rem}
.tag{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--sunk);color:var(--muted)}
.tag.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.tag.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.tag.y{background:var(--accent);color:var(--on-accent)}
input[type=range]{width:100%;accent-color:var(--green);height:32px}
input[type=text],input[type=number],select{background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;min-height:44px;width:100%}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.carpic{width:100%;max-width:100%;height:auto;display:block}
.carcard .pic{background:linear-gradient(to bottom,transparent 70%,var(--sunk) 70%);border-radius:8px;padding:6px 6px 0}
.coach{background:var(--ink);color:var(--surface);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center}
.coach b{color:var(--accent);font-family:var(--display);text-transform:uppercase;font-size:1.05rem;letter-spacing:.04em;flex:none}
.news{display:flex;flex-direction:column}
.news div{padding:9px 0;border-bottom:1px dashed var(--line);display:grid;grid-template-columns:72px 1fr;gap:10px;font-size:.92rem}
.news div:last-child{border-bottom:0}
.pips{display:flex;gap:4px}
.pips i{width:22px;height:7px;border-radius:2px;background:var(--sunk)}
.pips i.on{background:var(--accent)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
td.n,th.n{text-align:right}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.tech{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.tech:last-child{border-bottom:0}
.tech p{margin:0;font-size:.86rem;color:var(--muted);grid-column:1}

/* sheets & modals */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-in{max-width:880px;margin:0 auto;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(120px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.sheet-foot{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-top:2px solid var(--ink);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.split{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:760px){.split{grid-template-columns:1.1fr .9fr;align-items:start}.split .sticky{position:sticky;top:16px}}
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(10,14,12,.55);display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border:2px solid var(--ink);border-radius:14px;max-width:460px;width:100%;max-height:88vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.bigscore{font-family:var(--display);font-weight:900;font-size:4.2rem;line-height:.9}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;flex-direction:column;gap:8px;width:min(92vw,440px);pointer-events:none}
.toast{background:var(--ink);color:var(--surface);padding:11px 14px;border-radius:10px;font-size:.9rem;box-shadow:0 6px 20px var(--shadow);border-left:5px solid var(--accent);animation:tin .25s ease-out}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
@media (min-width:900px){.toasts{bottom:24px;left:calc(50% + 48px)}}
.track{display:flex;flex-direction:column;gap:6px}
.lane{position:relative;height:30px;background:var(--sunk);border-radius:6px;overflow:hidden}
.lane .fin{position:absolute;right:8px;top:0;bottom:0;width:6px;background:repeating-linear-gradient(var(--ink) 0 5px,var(--surface) 5px 10px)}
.lane .rc{position:absolute;left:0;top:3px;height:24px;display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;white-space:nowrap;transition-property:left;transition-timing-function:cubic-bezier(.3,.1,.4,1)}
.lane .rc i{width:34px;height:14px;border-radius:5px 9px 3px 3px;flex:none}
.lane.me{outline:2px solid var(--accent)}
.cyl{display:flex;flex-wrap:wrap;gap:5px;align-items:center;justify-content:center;padding:14px;background:var(--sunk);border-radius:8px;min-height:90px}
.cyl i{border-radius:50%;border:3px solid var(--muted);background:radial-gradient(circle at 40% 35%,var(--rim),var(--tyre))}

.diffchip{display:inline-block;background:var(--accent);color:var(--on-accent);border-radius:4px;padding:0 5px;letter-spacing:.06em}
.trim{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.trimname{font-family:var(--display);font-size:1.15rem;text-transform:uppercase;letter-spacing:.03em}
input.num{width:110px;text-align:right;font-weight:700}
input[type=color]{width:52px;height:44px;padding:2px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg)}
.anagrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.diag{width:100%;height:auto;display:block;background:var(--sunk);border-radius:8px}
.cylf{fill:var(--surface);stroke:var(--muted);stroke-width:2;animation:fire 1.8s linear infinite}
.cyln{font:700 11px var(--body);fill:var(--ink)}
@keyframes fire{0%,10%{fill:var(--accent);stroke:var(--ink)}22%,100%{fill:var(--surface);stroke:var(--muted)}}
textarea.code{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:9px;font:inherit;font-size:.75rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function engStats(e){
  const L0=LAYOUTS[e.layout],dy=e.year;
  if(L0.ev){const hp=e.evHp,bat=Math.max(.45,1-.025*(dy-2008));
    const w0=Math.round(110+hp*1.1*bat);
    return {ev:true,L:0,hp,tq:Math.round(hp*2.1),w:e.wo?clamp(e.wo,w0*.5,w0*2):w0,wAuto:w0,rel:clamp(Math.round(90+qa()/2),20,99),cost:Math.round(1200+hp*9*bat),cyl:0,rpm:14000,eco:1,co2:0}}
  const rot=L0.rot||0,cyl=L0.cyl,F=FUELS[e.fuel],J=INJ[e.inj],SC=SCS[e.sc||'none'];
  const L=rot?.654*rot:cyl*Math.PI/4*e.bore*e.bore*e.stroke/1e6;
  const r=rot?1:e.bore/e.stroke;
  const tech=1+.006*(dy-1970);
  const tb=e.turbos||0,bar=tb?e.boost:0;
  const injP=(e.inj==='di'&&e.fuel==='diesel')?1.25:J.p;
  const strokeF=rot?1:clamp(Math.pow(86/e.stroke,.8),.45,1.15);
  const spec=(rot?90:VALVES[e.valve].s)*F.p*injP*tech*(1+.3*(r-1))*(has('vvt')?1.08:1)*strokeF;
  const boostM=tb?1+bar*.35*(1+.03*(tb-1)):1;
  const hp=Math.round(L*spec*boostM*SC.p);
  const tq=Math.round(L*90*F.q*(1+.003*(dy-1970))*(1-.25*(r-1))*(e.inj==='di'?1.08:1)*(tb?1+bar*.5:1)*SC.p*(rot?.8:1));
  let w=rot?70+30*rot:(30+12*cyl+30*L)*(L0.wM||1);
  w*=F.w*EMATS[e.mat].w;w+=tb*12+(tb?8:0)+SC.w;
  const w0=Math.round(w);
  const rel=85+(L0.rel||0)+F.rel-(tb?4+bar*4+(tb-1)*1.2:0)-SC.rel-Math.max(0,spec*boostM*SC.p-110)*.08+qa();
  const cost=Math.round(220+L*110+cyl*42+(L0.cost||0)+(rot?0:VALVES[e.valve].c)+J.cost+F.cost+tb*(180+bar*40)+SC.cost+EMATS[e.mat].cost);
  const rpm=Math.round((5200+(e.valve==='dohc'?1100:e.valve==='sohc'?500:0)+1800*(r-1)+(rot?2500:0)+F.rpm)/100)*100;
  const eco=F.eco*J.eco*(tb?1+.04*bar:1)*SC.eco;
  return {L,hp,tq,w:e.wo?clamp(e.wo,w0*.5,w0*2):w0,wAuto:w0,rel:clamp(Math.round(rel),3,99),cost,cyl,rot,rpm,spec,boostM,eco,co2:F.co2};
}
function engDesc(e){const s=engStats(e),L=LAYOUTS[e.layout];if(s.ev)return `${s.hp} hp electric`;
  const ind=e.turbos?(e.turbos===1?'turbo':e.turbos===2?'twin-turbo':e.turbos+' turbos'):'';const sc=e.sc&&e.sc!=='none'?'supercharged':'';
  return `${s.L.toFixed(1)} L ${L.n} ${FUELS[e.fuel].n.toLowerCase()}${ind?' '+ind:''}${sc?' '+sc:''} · ${s.hp} hp`}
function emisLimit(y){if(y<1990)return 0;const pts=[[1990,230],[2000,190],[2010,150],[2020,115],[2035,85]];for(let i=1;i<pts.length;i++){if(y<=pts[i][0]){const[a,b]=pts[i-1],[c,d]=pts[i];return b+(d-b)*(y-a)/(c-a)}}return 85}
function carStats(c,y){
  y=y||yearF();
  const B=BODIES[c.body],E=engById(c.eng),es=engStats(E),G=GEARS[c.gb],D=DRIVES[c.dt],IN=INTS[c.int],M=MATS[c.mat],SU=SUSP[c.susp||'std'],H=HEADL[c.hl||'halogen'];
  const eq=(c.equip||[]).map(k=>EQUIP[k]).filter(Boolean);
  const sumq=f=>eq.reduce((a,q)=>a+(q[f]||0),0);
  const w0=Math.round(B.w*M.w*(1+.006*clamp(c.year-1970,0,60))+es.w+G.w+D.w+IN.w+SU.w+(c.lsd?8:0)+sumq('w'));
  const w=c.cw?clamp(c.cw,w0*.5,w0*2):w0;
  const pw=es.hp/(w/1000);
  const t=Math.max(1.9,(2.3+850/pw)*G.acc*D.acc*(es.ev?.85:1)*(c.lsd?.98:1));
  const top=Math.round(Math.min(B.vmax||999,37.7*Math.cbrt(es.hp)*B.aero*(es.ev?.92:1)));
  const era=Math.max(.68,1-.0075*(c.year-1970));
  const l100=es.ev?0:(1.8+2.6*Math.pow(es.L,.85)+w/280)*era*es.eco*G.eco*D.eco*(1+clamp((es.hp-150)/1500,0,1.5));
  const kwh=es.ev?11+w/160:0;
  const emis=es.ev?0:Math.round(l100*es.co2*(has('cat')?.85:1)*(es.rot?1.25:1));
  const k=clamp((y-1970)/55,0,1),te=13-6.5*k,ee=(11-5*k)*Math.pow(w/1150,.55),db=c.db||0,yy=y-1970;
  const sc={};
  sc.performance=clamp(50*Math.pow(te/t,1.4)+(top-(150+100*k))*.08,0,100);
  sc.economy=es.ev?92:clamp(50*(ee/l100),0,100);
  sc.green=es.ev?98:clamp(100-emis/2.6,0,100);
  sc.comfort=clamp(B.comfort+IN.comfort+G.comfort+D.comfort+SU.comfort+sumq('c')+db-Math.max(0,B.sport-60)*.2-yy*.45+8,0,100);
  sc.safety=clamp(30+sumq('s')+H.s+B.safety+M.safety+db*.5-yy*.75,0,100);
  sc.reliability=clamp(es.rel+G.rel+D.rel-eq.length*.3,0,100);
  sc.practicality=clamp(B.prac+D.prac+SU.prac,0,100);
  sc.prestige=clamp(IN.pres+sc.performance*.25+S.rep*.25+M.pres+SU.pres+H.pres+sumq('p')+(es.cyl>=8?8:0)+(es.cyl>=12?8:0)+db*.5-yy*.2,0,100);
  const fit={};
  for(const s of SEGK){let v=0;for(const[k2,wt]of Object.entries(SEGS[s].w))v+=wt*sc[k2];fit[s]=v/100}
  const cost=(es.cost+B.cost*M.cost+G.cost+D.cost+IN.cost+SU.cost+(c.lsd?120:0)+H.cost+sumq('cost')+300)*(has('robots')?.9:1)*(has('lean')?.9:1)*unitMul();
  const handling=clamp(.5+(B.sport+D.sport+SU.sport+(c.lsd?6:0))/200-(w-1000)/4000+(c.equip&&c.equip.includes('abs')?.05:0),.1,1.4);
  return {w,wAuto:w0,hp:es.hp,tq:es.tq,t,top,l100,kwh,emis,sc,fit,cost,handling,ev:es.ev,rel:sc.reliability};
}
function segValue(s,fr,body){return SEGS[s].base*(.35+1.3*fr)*(body?BODIES[body].vm:1)}
function bestSeg(st,body){let b=null,bv=-1;for(const s of SEGK){const v=st.fit[s]*BODIES[body].seg[s];if(v>bv){bv=v;b=s}}return b}
function suggestPrice(st,body){const s=bestSeg(st,body);return Math.max(st.cost*1.12,segValue(s,st.fit[s],body))}
function playerAppeal(c,st,s,y){
  const m=BODIES[c.body].seg[s];if(!m)return 0;
  const fr=st.fit[s],V=segValue(s,fr,c.body);
  const pf=clamp(Math.exp(-SEGS[s].el*(c.price/V-1)),.02,2.2);
  const age=y-c.year,fresh=age<4?1:Math.max(.35,1-.08*(age-4));
  const lim=emisLimit(y),ep=(lim&&st.emis>lim)?.6:1;
  return Math.pow(fr*m,2)*pf*fresh*(.7+c.review*.06)*ep;
}
function segSize(s,y){
  const g=1+.012*(y-1970);let v;
  if(s==='eco')v=3200*(1-.004*(y-1970));else if(s==='fam')v=3800;else if(s==='sport')v=700;else if(s==='lux')v=500+6*(y-1970);
  else if(s==='util')v=900+90*clamp(y-1985,0,56);else if(s==='com')v=1400+12*(y-1970);
  else v=y<1997?0:Math.min(5200,110*Math.pow(y-1997,1.25));
  return v*g*modSeg(s);
}
function activeMods(){return S.mods.filter(m=>m.until>S.day)}
function modSeg(s){return activeMods().reduce((a,m)=>a*(m.all||1)*((m.seg&&m.seg[s])||1),1)}
const modCost=()=>activeMods().reduce((a,m)=>a*(m.cost||1),1);
const modProd=()=>activeMods().reduce((a,m)=>a*(m.prod||1),1);
const mktBoost=()=>S.mkt.filter(m=>m.until>S.day).reduce((a,m)=>Math.max(a,m.b),1);
function creditLimit(){const inf=I();let wc=0;for(const c of S.cars)if(c.prod)wc+=c.prod*carStats(c).cost*inf;return 250e3*inf*S.hq+Math.min(wc,HQ[S.hq].cap*30e3*inf)*15}
const repF=()=>.55+S.rep/100*.9;
function solveMarket(y,stats){
  const dem={};S.cars.forEach(c=>dem[c.id]=0);
  const compU=S.comp.map(()=>0);let tot=0;const boost=mktBoost()*S.aware*repF()*demandMul();
  const segInfo={};
  for(const s of SEGK){
    const size=segSize(s,y);if(size<=0){segInfo[s]={size:0,me:0,comp:compU.map(()=>0)};continue}
    const ca=S.comp.map(cp=>y>=cp.from?cp.q[s]*cp.q[s]:0);
    const mine=S.cars.filter(c=>c.prod>0||c.inv>0).map(c=>({c,ap:playerAppeal(c,stats[c.id],s,y)*boost})).filter(o=>o.ap>0).sort((a,b)=>b.ap-a.ap);
    let eff=0;mine.forEach((o,i)=>eff+=o.ap*Math.pow(.6,i));
    const sm=mine.reduce((a,o)=>a+o.ap,0),total=eff+ca.reduce((a,b)=>a+b,0)||1;
    const my=size*eff/total;
    mine.forEach(o=>dem[o.c.id]+=my*o.ap/sm);
    const cu=ca.map(a=>size*a/total);cu.forEach((u,i)=>compU[i]+=u);
    segInfo[s]={size,me:my,comp:cu};tot+=size;
  }
  return {dem,compU,tot,segInfo};
}

function simDay(){
  const y=yearF(),inf=infl(y),stats={};
  S.cars.forEach(c=>stats[c.id]=carStats(c,y));
  const cap=Math.floor(HQ[S.hq].cap*modProd()),credit=creditLimit();
  let used=0,prodCost=0,cashBlocked=false;
  const want=S.cars.reduce((a,c)=>a+(c.prod||0),0),scale=want>cap?cap/want:1;
  for(const c of S.cars){
    c.built=0;c.block=null;
    if(!c.prod)continue;
    const unit=stats[c.id].cost*inf*modCost();
    let n=Math.min(Math.floor(c.prod*scale+(c.pfrac||0)),cap-used);
    c.pfrac=scale<1?((c.pfrac||0)+c.prod*scale)%1:0;
    if(n<c.prod)c.block='cap';
    if(S.money-prodCost-n*unit<-credit){n=Math.max(0,Math.floor((S.money-prodCost+credit)/unit));c.block='cash';cashBlocked=true}
    c.inv+=n;c.built=n;used+=n;prodCost+=n*unit;
  }
  if(cashBlocked&&!S.credWarn){S.credWarn=1;notify('Out of cash and credit. Factories are building less until money comes in. Lower production or raise prices.',true)}
  if(!cashBlocked)S.credWarn=0;
  S.used=used;
  const mk=solveMarket(y,stats),lim=emisLimit(y);
  let rev=0,sold=0,fines=0;
  for(const c of S.cars){
    const d=mk.dem[c.id]||0,wantN=(c.frac||0)+d;
    const n=Math.min(Math.floor(wantN),c.inv);
    c.frac=Math.min(wantN-n,.99);c.inv-=n;c.sold+=n;sold+=n;rev+=n*c.price*inf;
    if(lim&&stats[c.id].emis>lim)fines+=n*150*inf;
    c.rate=c.rate*.85+n*.15;c.dem=c.dem*.85+d*.15;
    if(n){const a=S.ana,E=engById(c.eng),ek=LAYOUTS[E.layout].ev?'Electric':LAYOUTS[E.layout].n+' '+FUELS[E.fuel].n.toLowerCase();

function yearEnd(yr){

  S.anaLast=S.ana;S.ana=newAna();

function checkEvents(){

function randomEvent(){
  const act=S.cars.filter(c=>c.prod>0),opts=[];

  const weak=act.find(c=>carStats(c).rel<62);

  if(act.length)opts.push(()=>{S.mods.push({prod:.5,until:S.day+14});return 'Workers strike at your plant. Output is halved for two weeks.'});

  opts.push(()=>{const r=pick(S.comp.filter(c=>yearF()>=c.from));return `${r.n} unveils a new model line. Competition heats up.`});

}

function reviewCar(c,st){
  const bs=bestSeg(st,c.body),fr=st.fit[bs],V=segValue(bs,fr,c.body),val=V/c.price;
  let score=clamp(fr*9.5+(val-1)*3+1.2,1,10);score=Math.round(score*2)/2;
  const ranked=Object.entries(st.sc).sort((a,b)=>b[1]-a[1]);
  const good=ranked.slice(0,2).map(([k])=>SCORE_N[k].toLowerCase()),bad=ranked.slice(-2).map(([k])=>SCORE_N[k].toLowerCase());
  const pub=pick(['Autocar Weekly','Road & Wheel','Gearbox Gazette','The Driving Post','Fleet & Freight']);
  const verdict=score>=8.5?'A new benchmark. Buy one.':score>=7?'A strong contender in its class.':score>=5.5?'Competent, but rivals do it better.':'Hard to recommend at this price.';
  const priceLine=val>1.15?'and it is a bargain for the money':val<.85?'though the price is hard to justify':'and it is fairly priced';
  return {score,html:`<span class="tag">${pub} · ${SEGS[bs].n} class</span><div class="spread"><h2>${esc(fullName(c))}</h2><span class="bigscore">${score.toFixed(1)}</span></div>${carSVG(c.body,c.color,c.mname)}<p style="margin:0"><b>${verdict}</b> Testers praised its ${good.join(' and ')}, ${priceLine}. Weak points: ${bad.join(' and ')}.</p><p class="muted" style="margin:0">Set its production on the Cars tab to put it on sale.</p>`};
}

    <div class="field"><span class="lbl">Move to another device</span><p class="muted" style="margin:0">Copy this code, send it to yourself, then paste it on the other device's start screen.</p><textarea id="saveCode" rows="3" readonly class="code">${exportCode()}</textarea><button class="btn" data-a="copyCode">Copy save code</button></div>`,[['Close','close'],['Save now','saveNow'],['New company','newGame',1]]);break;

  case 'eo':{draft[x]=y;if(x==='fuel'&&y==='diesel'){draft.bore=Math.max(draft.bore,80);draft.stroke=Math.max(draft.stroke,86)}fixEngineDraft();renderSheet(true);break}

  case 'cs':draft.equip=draft.equip.includes(x)?draft.equip.filter(s=>s!==x):[...draft.equip,x];renderSheet(true);break;

  case 'launchCar':{const dev=carDev();if(S.money<dev){notify(`You need ${fm(dev)} to develop this.`);break}
    const id='c'+(S.nid++);const c={...draftCar(),id,model:draft.mode==='trim'?draft.model:id,prod:0,inv:0,sold:0,rate:0,dem:0,frac:0};delete c.mode;delete c.name;delete c.autoTrim;

    <small>${esc(engDesc(E))} · ${GEARS[c.gb].n} · ${DRIVES[c.dt].n}${c.lsd?' with LSD':''} · ${SUSP[c.susp].n} suspension · ${INTS[c.int].n} interior · ${HEADL[c.hl].n} lights${eq.length?' · '+eq.join(', '):''}</small>
    ${statRows(st.sc)}<small>Scores are rated against vehicles of ${curYear()}. Older designs slip as rivals improve.</small>`,[['Close','close',1]]);break}

function runRace(id){
  const r=RACES.find(r=>r.id===id),inf=I(),sel=$('#rc-'+id);if(!sel)return;
  const c=carById(sel.value),st=carStats(c);S.money-=r.fee*inf;S.races[id]=S.day+90;
  const ex=expIdx(yearF())*r.tier;
  const field=[{n:fullName(c),me:1,col:c.color,sc:raceIdx(c,r)*rnd(.95,1.05)}];
  RIVALS.slice().sort(()=>Math.random()-.5).slice(0,7).forEach((n,i)=>field.push({n,col:S.comp[i%S.comp.length].c,sc:ex*rnd(.86,1.12)}));
  if(r.rel)field.forEach(f=>{const rel=f.me?st.rel:80;if(Math.random()<(1-rel/100)*.6)f.dnf=1});
  if(st.rel<30&&Math.random()<.5)field[0].dnf=1;
  const order=field.slice().sort((a,b)=>(a.dnf?1:0)-(b.dnf?1:0)||b.sc-a.sc);
  const pos=order.findIndex(f=>f.me)+1,me=field[0];
  const fin=field.filter(f=>!f.dnf),best=fin.length?Math.max(...fin.map(f=>f.sc)):1;
  const dur=f=>f.dnf?2:2.6*Math.pow(best/f.sc,5);
  const lanes=field.map(f=>`<div class="lane ${f.me?'me':''}"><div class="fin"></div><div class="rc" data-sc="${f.dnf?0:f.sc}" style="transition-duration:${dur(f).toFixed(2)}s"><i style="background:${f.col}"></i>${esc(f.n)}</div></div>`).join('');
  modal(`<span class="tag">${r.n} · ${dateStr(S.day)}</span><h2>Lights out</h2><div class="track" id="trk">${lanes}</div><div id="rres" class="muted">Racing…</div>`,[]);
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('#trk .rc').forEach(el=>{el.style.left=el.dataset.sc==='0'?'38%':'calc(100% - 150px)'})));
  let prize=0,rep=0;
  if(!me.dnf){if(pos===1){prize=r.prize*inf;rep=4}else if(pos===2){prize=r.prize*inf*.45;rep=2}else if(pos===3){prize=r.prize*inf*.2;rep=1}else if(pos>6)rep=-.5}
  S.money+=prize;S.rep=clamp(S.rep+rep*r.tier,0,100);S.aware=clamp(S.aware+(pos<=3?.006*r.tier:.001),0,1);
  const msg=me.dnf?`The ${fullName(c)} retired with mechanical failure.`:`The ${fullName(c)} finished P${pos} of 8${prize?` and won ${fm(prize)}`:''}.`;
  setTimeout(()=>{const res=$('#rres');if(!res)return;res.innerHTML=`<h3>${me.dnf?'DNF':'P'+pos}</h3><p style="margin:4px 0 0">${msg}${rep>0?' Reputation up.':''}</p><ol style="margin:8px 0 0;padding-left:20px">${order.map(f=>`<li>${f.me?'<b>':''}${esc(f.n)}${f.me?'</b>':''}${f.dnf?' · DNF':''}</li>`).join('')}</ol>`;
    $('.modal').insertAdjacentHTML('beforeend','<div class="row" style="justify-content:flex-end"><button class="btn primary" data-a="close">Back to the paddock</button></div>');
    notify(r.n+': '+msg,true);if(tab==='race')renderView()},Math.min(6000,2700+Math.max(0,...fin.map(f=>dur(f)*1000))));
}
function gameOver(){modal(`<span class="tag bad">${dateStr(S.day)}</span><h2>Bankrupt</h2><p>The banks have called in ${esc(S.name)}'s loans. You sold ${fn(S.cars.reduce((a,c)=>a+c.sold,0))} vehicles before the doors closed.</p>`,[['Start a new company','restart',1]])}

/* ============ EVENTS ============ */
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.disabled)return;act(t.dataset.a)});
document.addEventListener('input',e=>{
  const t=e.target,k=t.dataset&&t.dataset.i;if(!k)return;
  const [a,id]=k.split(':');
  if(a==='prod'||a==='prodn'){const c=carById(id);const cap=HQ[S.hq].cap;let v=Math.round(+t.value||0);if(a==='prodn'&&t.value==='')return;v=clamp(v,0,cap);c.prod=v;
    const sl=$('#prod-'+id),nb=$('#pn-'+id);if(a==='prod'&&nb)nb.value=v;if(a==='prodn'&&sl)sl.value=v;refreshLive()}
  else if(a==='dname')draft.name=t.value||'Untitled';
  else if(a==='mname')draft.mname=t.value||'Untitled';
  else if(a==='trim')draft.trim=t.value;
  else if(a==='bore'||a==='stroke'||a==='evHp'){draft[a]=+t.value;const lab=$(a==='evHp'?'#evv':'#'+a+'v');if(lab)lab.textContent=a==='evHp'?t.value+' hp':t.value+' mm';updateSheetStats()}
  else if(a==='turbos'){draft.turbos=+t.value;$('#turbosv').textContent=draft.turbos||'None';const bv=$('#boostv');if(bv)bv.textContent=draft.turbos?draft.boost.toFixed(1)+' bar':'no turbos';updateSheetStats()}
  else if(a==='boost'){draft.boost=+t.value;$('#boostv').textContent=draft.turbos?draft.boost.toFixed(1)+' bar':'no turbos';updateSheetStats()}
  else if(a==='ewo'){draft.wo=+t.value||null;updateSheetStats()}
  else if(a==='cw'){draft.cw=+t.value||null;updateSheetStats()}
  else if(a==='color'){draft.color=t.value;const h=$('#chex');if(h)h.value=t.value;document.querySelectorAll('.swatch').forEach(s=>s.setAttribute('aria-pressed','false'));updateSheetStats()}
  else if(a==='hex'){if(/^#[0-9a-fA-F]{6}$/.test(t.value)){draft.color=t.value.toLowerCase();const p=$('#cpick');if(p)p.value=draft.color;updateSheetStats()}}
  else if(a==='cprice'){draft.price=+t.value||null;updateSheetStats()}
  else if(a==='setupYear'){setupYear=+t.value;$('#eraNote').innerHTML=setupNote();document.querySelectorAll('[data-a^="sy:"]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.a.slice(3)===Math.floor(setupYear/10)*10))}
});
document.addEventListener('change',e=>{
  const t=e.target,k=t.dataset&&t.dataset.i;if(!k)return;const [a,id]=k.split(':');
  if(a==='price'){const c=carById(id);const v=+t.value;if(v>0)c.price=v/I();renderView()}
  else if(a==='prodn'){const c=carById(id);t.value=c.prod}
  else if(a==='ceng'){draft.eng=t.value;const ev=LAYOUTS[engById(t.value).layout].ev;if(ev)draft.gb='ev1';else if(GEARS[draft.gb].ev)draft.gb=has('m5')?'m5':'m4';if(draft.trim===draft.autoTrim)draft.trim=draft.autoTrim=suggestTrim(draft.eng,draft.dt);renderSheet(true)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modal'))closeModal();else if(sheet){sheet=null;renderSheet()}}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S)save()});

/* ============ BOOT ============ */
function start(data){
  S=migrate((data&&data.S)||null)||load();
  if(!S||S.over){S=null;showSetup(false);return}
  tab=(data&&data.tab)||'hq';
  renderTop();renderNav();renderView();setSpeed(S.speed??1);
}
try{window.claude?.hot?.snapshot?.(()=>({S,tab}))}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
